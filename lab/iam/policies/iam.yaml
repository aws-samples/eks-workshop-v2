Version: "2012-10-17"
Statement:
  - Effect: Allow
    Action:
      - iam:CreateRole
      - iam:GetRolePolicy
      - iam:DetachRolePolicy
      - iam:AttachRolePolicy
      - iam:PutRolePolicy
      - iam:PutRolePermissionsBoundary
      - iam:DeleteRolePolicy
      - iam:DeleteRole
      - iam:ListInstanceProfilesForRole
      - iam:ListAttachedRolePolicies
      - iam:ListRolePolicies
      - iam:TagRole
      - iam:PassRole
      - sts:AssumeRole
      - iam:DeleteServiceLinkedRole
      - iam:GetServiceLinkedRoleDeletionStatus
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:role/${Env}*
      - !Sub arn:aws:iam::${AWS::AccountId}:role/eksctl-${Env}*
      - !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/fis*
  - Effect: Allow
    Action:
      - iam:CreatePolicy
      - iam:DeletePolicy
      - iam:GetPolicyVersion
      - iam:DeletePolicyVersion
      - iam:ListPolicyVersions
      - iam:TagPolicy
      - iam:GetPolicy
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:policy/${Env}*
      - !Sub arn:aws:iam::${AWS::AccountId}:policy/eksctl-${Env}*
  - Effect: Allow
    Action:
      - iam:CreateInstanceProfile
      - iam:DeleteInstanceProfile
      - iam:GetInstanceProfile
      - iam:TagInstanceProfile
      - iam:RemoveRoleFromInstanceProfile
      - iam:AddRoleToInstanceProfile
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/${Env}*
      - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/eksctl-${Env}*
      - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/eks-*
  - Effect: Allow
    Action:
      - iam:CreateUser
      - iam:DeleteUser
      - iam:TagUser
      - iam:GetUser
      - iam:ListGroupsForUser
      - iam:AttachUserPolicy
      - iam:DetachUserPolicy
      - iam:ListAttachedUserPolicies
      - iam:*SSHPublicKey
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:user/${Env}*
  - Effect: Allow
    Action:
      - iam:ListOpenIDConnectProviders
      - iam:GetRole
      - iam:ListPolicies
      - iam:ListRoles
    Resource: ["*"]
  # Every OIDC provider the workshop touches is the cluster's own EKS issuer
  # (oidc.eks.<region>.amazonaws.com/id/<hash>), so these are scoped to that
  # prefix rather than to all providers in the account.
  - Effect: Allow
    Action:
      - iam:CreateOpenIDConnectProvider
      - iam:DeleteOpenIDConnectProvider
      - iam:TagOpenIDConnectProvider
      - iam:GetOpenIDConnectProvider
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.*
  - Effect: Allow
    Action:
      - iam:CreateServiceLinkedRole
    Resource: ["*"]
    Condition:
      StringEquals:
        iam:AWSServiceName:
          - eks.amazonaws.com
          - eks-nodegroup.amazonaws.com
          - eks-fargate.amazonaws.com
          - capabilities.eks.amazonaws.com
          - sso.amazonaws.com
          - guardduty.amazonaws.com
          - spot.amazonaws.com
          - fis.amazonaws.com
          - transitgateway.amazonaws.com
          - fsx.amazonaws.com
  # Permissions boundary guard. The Allow statements above let the IDE create
  # roles and users and give them permissions, which on their own would let it
  # mint an administrator role and assume or pass it. These Deny statements
  # apply to every Allow in every IDE policy: a role or user may only be
  # created or granted permissions when it carries the workshop boundary
  # (boundary.yaml), and the boundary cannot be removed or edited.
  # iam:PermissionsBoundary is the boundary of the role or user being changed,
  # so this also covers roles that already exist without one (including the
  # IDE role itself).
  - Sid: RequireBoundary
    Effect: Deny
    Action:
      - iam:CreateRole
      - iam:PutRolePolicy
      - iam:PutRolePermissionsBoundary
      - iam:CreateUser
      - iam:PutUserPolicy
      - iam:AttachUserPolicy
      - iam:PutUserPermissionsBoundary
    Resource: "*"
    Condition:
      StringNotEquals:
        iam:PermissionsBoundary: !Ref EksWorkshopBoundaryPolicy
  - Sid: RequireBoundaryToAttach
    Effect: Deny
    Action:
      - iam:AttachRolePolicy
    NotResource:
      - !Sub arn:aws:iam::${AWS::AccountId}:role/eksctl-${Env}*-nodegroup-*
    Condition:
      StringNotEquals:
        iam:PermissionsBoundary: !Ref EksWorkshopBoundaryPolicy
  # The S3 Files lab attaches these managed policies to the cluster's managed
  # node group roles, which eksctl creates outside the IDE (CI, Workshop Studio)
  # without the boundary. Only these policies may be attached to an unbounded
  # node group role.
  - Sid: RequireBoundaryToAttachNodeRole
    Effect: Deny
    Action:
      - iam:AttachRolePolicy
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:role/eksctl-${Env}*-nodegroup-*
    Condition:
      StringNotEquals:
        iam:PermissionsBoundary: !Ref EksWorkshopBoundaryPolicy
        iam:PolicyARN:
          - arn:aws:iam::aws:policy/AmazonS3FilesClientFullAccess
          - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
          - arn:aws:iam::aws:policy/AmazonElasticFileSystemsUtils
  - Sid: KeepBoundary
    Effect: Deny
    Action:
      - iam:DeleteRolePermissionsBoundary
      - iam:DeleteUserPermissionsBoundary
    Resource: "*"
  - Sid: ProtectBoundaryPolicy
    Effect: Deny
    Action:
      - iam:CreatePolicyVersion
      - iam:DeletePolicy
      - iam:DeletePolicyVersion
      - iam:SetDefaultPolicyVersion
      - iam:TagPolicy
      - iam:UntagPolicy
    Resource: !Ref EksWorkshopBoundaryPolicy
