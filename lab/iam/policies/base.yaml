Version: "2012-10-17"
Statement:
  # eks:* is kept as a wildcard so newly released EKS APIs keep working, but it
  # is scoped to the workshop's own clusters and their sub-resources: nodegroups,
  # addons, access entries and the rest are all named after the cluster, so a
  # single ${Env}* prefix per resource type covers them.
  - Effect: Allow
    Action:
      - eks:*
    Resource:
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:addon/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:fargateprofile/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:identityproviderconfig/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:access-entry/${Env}*
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:podidentityassociation/${Env}*
      # Capability ARNs are capability/<cluster>/<name>/<type>/<id>, so the same
      # prefix covers them. Needed because a learner in their own account creates
      # the Argo CD capability from the lab; at an AWS event pre-provisioning has
      # already done it and only Describe below is exercised.
      - !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:capability/${Env}*
  # Operations that cannot name a resource: listing and describing across the
  # account, and creating or registering a cluster that does not exist yet.
  - Effect: Allow
    Action:
      - eks:List*
      - eks:Describe*
      - eks:CreateCluster
      - eks:RegisterCluster
      - sts:GetCallerIdentity
    Resource: ["*"]
  # Launch templates are created by eksctl with generated ids, so these are
  # scoped by resource type.
  - Effect: Allow
    Action:
      - ec2:CreateLaunchTemplate
      - ec2:DeleteLaunchTemplate
    Resource:
      - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/*
  # Access to the AWS-hosted Amazon EKS MCP server (used by the aiml/kiro-cli module).
  # All three actions are required because the lab uses read-only and write (privileged) tools.
  # The AWS managed policy AmazonEKSMCPReadOnlyAccess covers only InvokeMcp + CallReadOnlyTool.
  # eks-mcp/aws-mcp actions do not support resource-level scoping, so Resource is "*".
  - Effect: Allow
    Action:
      - eks-mcp:InvokeMcp
      - eks-mcp:CallReadOnlyTool
      - eks-mcp:CallPrivilegedTool
    Resource: ["*"]
  # Access to the AWS-hosted AWS API MCP server (used by the aiml/kiro-cli module).
  - Effect: Allow
    Action:
      - aws-mcp:InvokeMcp
      - aws-mcp:CallReadOnlyTool
      - aws-mcp:CallReadWriteTool
    Resource: ["*"]
  - Effect: Allow
    Action:
      - cloudformation:CreateStack
      - cloudformation:CreateChangeSet
      - cloudformation:UpdateTerminationProtection
      - cloudformation:DeleteStack
    Resource:
      - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eksctl-${Env}*
    Condition:
      "Null":
        cloudformation:RoleARN: "true"
  - Effect: Allow
    Action:
      - cloudformation:Get*
      - cloudformation:Describe*
      - cloudformation:List*
      - cloudformation:TagResource
    Resource: ["*"]
  - Effect: Allow
    Action:
      - autoscaling:UpdateAutoScalingGroup
    Resource: ["*"]
    Condition:
      StringLike:
        aws:ResourceTag/eks:cluster-name:
          - ${Env}
  - Effect: Allow
    Action:
      - autoscaling:Get*
      - autoscaling:Describe*
    Resource: ["*"]
  - Effect: Allow
    Action:
      - ecr-public:GetAuthorizationToken
      - sts:GetServiceBearerToken
    Resource: ["*"]
  # Needed by ec2-instance-selector to fetch On-Demand prices; takes no resource ARN.
  - Effect: Allow
    Action:
      - pricing:GetProducts
    Resource: ["*"]
  # CreateKey has no key to target yet, so it stays on "*". Everything else
  # operates on an existing key, whose id is generated, so it is scoped by
  # resource type.
  - Effect: Allow
    Action:
      - kms:CreateKey
    Resource: ["*"]
  - Effect: Allow
    Action:
      - kms:TagResource
      - kms:ScheduleKeyDeletion
      - kms:CreateGrant
      - kms:EnableKeyRotation
      - kms:GetKeyPolicy
      - kms:GetKeyRotationStatus
      - kms:ListResourceTags
      - kms:PutKeyPolicy
    Resource:
      - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
  - Effect: Allow
    Action:
      - kms:Decrypt
      - kms:DescribeKey
      - kms:EnableKeyRotation
      - kms:Encrypt
      - kms:GenerateDataKey
      - kms:GenerateDataKeyWithoutPlaintext
    Resource: ["*"]
    Condition:
      StringLike:
        kms:RequestAlias: ["alias/${Env}*", "alias/eks/${Env}*"]
  - Effect: Allow
    Action:
      - kms:CreateAlias
      - kms:DeleteAlias
    Resource:
      - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/${Env}*
      - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/eks/${Env}*
      - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
  - Effect: Allow
    Action:
      - kms:List*
      - kms:Get*
      - kms:Describe*
    Resource: ["*"]
  - Effect: Allow
    Action:
      - ssm:GetParameter
    Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/*
