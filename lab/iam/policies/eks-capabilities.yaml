Version: "2012-10-17"
Statement:
  # IAM Identity Center lookup for the capability's data sources. The capability
  # registers an SSO application against the instance when it is created, so the IDE
  # role (the principal calling CreateCapability) needs the application lifecycle
  # actions too.
  #
  # Deliberately excludes sso:CreateInstance and sso:DeleteInstance. Enabling Identity
  # Center is an account-wide and effectively irreversible change, so the IDE never
  # does it: events get an instance from the pre-provisioning pipeline, and anyone else
  # enables it themselves before starting.
  - Effect: Allow
    Action:
      - sso:ListInstances
      - sso:DescribeInstance
      - sso:GetApplication
      - sso:ListApplications
      - sso:CreateApplication
      - sso:UpdateApplication
      - sso:DeleteApplication
      - sso:PutApplicationGrant
      - sso:GetApplicationGrant
      - sso:ListApplicationGrants
      - sso:DeleteApplicationGrant
      - sso:PutApplicationAuthenticationMethod
      - sso:GetApplicationAuthenticationMethod
      - sso:ListApplicationAuthenticationMethods
      - sso:DeleteApplicationAuthenticationMethod
      - sso:PutApplicationAccessScope
      - sso:GetApplicationAccessScope
      - sso:ListApplicationAccessScopes
      - sso:DeleteApplicationAccessScope
      - sso:PutApplicationAssignmentConfiguration
      - sso:GetApplicationAssignmentConfiguration
      - sso:CreateApplicationAssignment
      - sso:DeleteApplicationAssignment
      - sso:ListApplicationAssignments
      - sso:TagResource
      - sso:UntagResource
      - sso:ListTagsForResource
    Resource: ["*"]
  # Reads only. This fast path used to create the Argo CD user, group and membership
  # from lab Terraform, which meant a path a learner can run wrote into an
  # account-wide directory, and minted a user nobody had activated so it could not
  # sign in. Both now come from manifests/.workshop/terraform/preprovision-base, which
  # only the pre-provisioning pipeline reaches, so the IDE role no longer needs to
  # write to Identity Center at all.
  - Effect: Allow
    Action:
      - identitystore:ListUsers
      - identitystore:ListGroups
      - identitystore:ListGroupMemberships
      - identitystore:DescribeUser
      - identitystore:DescribeGroup
      - identitystore:DescribeGroupMembership
      - identitystore:GetUserId
      - identitystore:GetGroupId
      - identitystore:GetGroupMembershipId
    Resource: ["*"]

  # CodeCommit Git data plane: the lab pages clone, push, and pull against
  # the seeded repository using git-remote-codecommit. Creation/deletion
  # is in labs2.yaml; this scope adds the per-commit data ops.
  - Effect: Allow
    Action:
      - codecommit:GitPull
      - codecommit:GitPush
      - codecommit:GetBranch
      - codecommit:GetCommit
      - codecommit:GetRepository
      - codecommit:GetFile
      - codecommit:GetFolder
      - codecommit:GetReferences
      - codecommit:ListBranches
      - codecommit:BatchGetCommits
      - codecommit:BatchGetRepositories
      - codecommit:CreateBranch
      - codecommit:CreateCommit
      - codecommit:UpdateDefaultBranch
    Resource:
      - !Sub arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${Env}*

  # EKS Capabilities lifecycle. eks:* in base.yaml is tag-scoped to the
  # cluster; capability operations work against capability ARNs that don't
  # carry the same tag at create-time. Granting them explicitly here.
  - Effect: Allow
    Action:
      - eks:CreateCapability
      - eks:DeleteCapability
      - eks:DescribeCapability
      - eks:UpdateCapability
      - eks:ListCapabilities
    Resource: ["*"]

  # iam:PassRole for the IAM Capability Roles passed to CreateCapability.
  - Effect: Allow
    Action:
      - iam:PassRole
    Resource:
      - !Sub arn:aws:iam::${AWS::AccountId}:role/${Env}*-cap-role
    Condition:
      StringEquals:
        iam:PassedToService: capabilities.eks.amazonaws.com
