apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: eks-auto-alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: eks-auto-alb
---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: eks-auto-alb
spec:
  scheme: internet-facing
  targetType: ip
  # Open for this optional, throwaway demo ALB. EKS Auto Mode configures the
  # load balancer from IngressClassParams (the alb.ingress.kubernetes.io/*
  # annotations are ignored), so restricting access would go here.
  inboundCIDRs:
    - 0.0.0.0/0
