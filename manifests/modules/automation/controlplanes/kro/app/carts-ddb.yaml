apiVersion: kro.run/v1alpha1
kind: WebApplicationDynamoDB
metadata:
  name: carts
  namespace: carts
spec:
  # Basic types
  appName: carts
  clusterName: ${EKS_CLUSTER_NAME}
  replicas: 1
  image: "public.ecr.aws/aws-containers/retail-store-sample-cart:1.2.1"
  port: 8080

  dynamodb:
    tableName: "${EKS_CLUSTER_NAME}-carts-kro"
    # The ACK capability role's permissions boundary only lets it create IAM
    # roles that carry this same boundary.
    iamPermissionsBoundary: "${EKS_IAM_PERMISSIONS_BOUNDARY_ARN}"

  env:
    RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
    RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME: "${EKS_CLUSTER_NAME}-carts-kro"
