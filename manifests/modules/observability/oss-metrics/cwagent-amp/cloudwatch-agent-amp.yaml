# Configuration values for the amazon-cloudwatch-observability add-on.
#
# The add-on deploys the CloudWatch agent, which is built on the OpenTelemetry
# collector. Here we attach an OpenTelemetry pipeline that scrapes the Prometheus
# metrics exposed by the application pods and remote-writes them to Amazon Managed
# Service for Prometheus (AMP) using the prometheusremotewrite exporter and the
# sigv4auth extension.
#
# The pipeline is attached to the "cloudwatch-agent-cluster-scraper" agent only
# (a single-replica Deployment) rather than the global agent config. This is
# deliberate: the global config is inherited by the node-level DaemonSet too, so
# every node would scrape and remote-write the same series, and AMP rejects the
# resulting duplicate samples. Scoping the pipeline to the single cluster-scraper
# means each series is written exactly once.
#
# ${AMP_ENDPOINT} and ${AWS_REGION} are substituted by envsubst before this file
# is handed to the add-on.
otelContainerInsights:
  enabled: true
  logs:
    enabled: false
agents:
  - name: cloudwatch-agent
  - name: cloudwatch-agent-cluster-scraper
    mode: deployment
    otelConfig:
      extensions:
        sigv4auth:
          region: ${AWS_REGION}
          service: aps
      receivers:
        prometheus/amp:
          config:
            global:
              scrape_interval: 30s
              scrape_timeout: 15s
              external_labels:
                cluster: eks-workshop
            scrape_configs:
              # Kubelet and cAdvisor are scraped directly on each node (role: node
              # sets __address__ to <node>:10250) rather than through the API server
              # proxy. The proxy path would require a "$1" capture-group replacement,
              # and the CloudWatch agent expands "$1" as an environment variable — so a
              # direct scrape with a static metrics_path avoids the escaping problem and
              # feeds the Kubernetes cluster dashboard in Grafana.
              - job_name: kubelet
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
              - job_name: cadvisor
                scheme: https
                metrics_path: /metrics/cadvisor
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
              - job_name: kubernetes-pods
                honor_labels: true
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels:
                      [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: true
                  - source_labels:
                      [
                        __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow,
                      ]
                    action: drop
                    regex: true
                  - source_labels:
                      [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                    action: replace
                    regex: (https?)
                    target_label: __scheme__
                  - source_labels:
                      [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Pending|Succeeded|Failed|Completed
                    action: drop
      processors:
        batch/amp:
          timeout: 30s
      exporters:
        prometheusremotewrite/amp:
          endpoint: "${AMP_ENDPOINT}api/v1/remote_write"
          auth:
            authenticator: sigv4auth
      service:
        extensions: [sigv4auth]
        pipelines:
          metrics/amp:
            receivers: [prometheus/amp]
            processors: [batch/amp]
            exporters: [prometheusremotewrite/amp]
