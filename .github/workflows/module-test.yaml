name: Execute module test

on:
  workflow_call:
    inputs:
      module:
        type: string
        default: "-"
      glob:
        type: string
        default: "-"
      idc:
        description: >-
          Create the IAM Identity Center test identity before testing (the user,
          the <cluster>-argocd-admins group and its membership, and the secret
          holding the activated password) and delete it afterwards. Needed by
          modules that read an Identity Center user they refuse to create, such as
          Argo CD. The lab still creates everything else itself through a normal
          prepare-environment, exactly as it does outside an event.
        type: boolean
        default: false
    outputs:
      durations-artifact:
        description: "The artifact ID of the test durations file"
        value: ${{ jobs.run-tests.outputs.durations-artifact }}

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    if: github.repository == 'aws-samples/eks-workshop-v2'
    name: run-tests
    runs-on: ubuntu-latest
    # The test account's IAM Identity Center instance is permanent, so a run only
    # adopts it and never creates or deletes it. What a run writes into it is named
    # after its own cluster ID, so idc runs do not collide and need no shared queue.
    concurrency:
      group: ${{ format('module-test-{0}-{1}', inputs.module, inputs.glob) }}
      cancel-in-progress: false
    outputs:
      durations-artifact: ${{ steps.upload-durations.outputs.artifact-id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Install utilities
        run: |
          sudo apt install -y gettext

          mkdir -p ${HOME}/.local/bin
          wget -q https://github.com/jckuester/awsweeper/releases/download/v0.12.0/awsweeper_0.12.0_linux_amd64.tar.gz
          tar zxf awsweeper_0.12.0_linux_amd64.tar.gz
          mv awsweeper_0.12.0_linux_amd64/awsweeper ${HOME}/.local/bin

          chmod +x ${HOME}/.local/bin/*

          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Install Terraform
        # Creating the Identity Center test identity runs terraform on the runner
        # itself, not inside the lab container, and ubuntu-latest does not ship it.
        # Same version the lab IDE installs (terraform_version in
        # lab/scripts/installer.sh); keep them in step.
        # Installed before the clusters are created so the always() destroy step
        # below still has it when an earlier step fails.
        if: inputs.idc == true
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false
      - name: Set cluster ID
        env:
          RUN_ID: "${{ github.job }}"
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          CLUSTER_ID=$(echo $RANDOM | md5sum | head -c 8)
          echo "Using cluster ID ${CLUSTER_ID}"
          echo "CLUSTER_ID=$CLUSTER_ID" >> $GITHUB_ENV
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Create infrastructure
        id: create-infrastructure
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make create-infrastructure environment="$CLUSTER_ID"
      - name: Create IAM Identity Center test identity
        # Only manifests/.workshop/terraform/preprovision-base, never the module's own
        # preprovision/ directory: the lab creates the rest itself.
        if: inputs.idc == true
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=apply module="idc-base"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Module
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          GENERATE_TIMINGS: 1
          TEST_REPORT: /tmp/test-output.json
          MODULE: ${{ inputs.module }}
          GLOB: ${{ inputs.glob }}
          AWS_REGION: "${{ secrets.AWS_REGION }}"
          DOCKER_DNS_OVERRIDE: "8.8.8.8"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          bash hack/run-tests.sh "$CLUSTER_ID" "$MODULE" "$GLOB"
      - uses: actions/upload-artifact@v4
        id: upload-durations
        with:
          name: test-durations-${{ env.CLUSTER_ID }}
          path: website/test-durations.json
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Cleanup
        if: always()
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make test environment="$CLUSTER_ID" module="cleanup"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Destroy IAM Identity Center test identity
        # After the lab cleanup, so no capability still maps the group. The Identity
        # Center instance itself is permanent in the test account and is not deleted:
        # preprovision-base only removes an instance it created.
        if: always() && inputs.idc == true
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=destroy module="idc-base"
      - name: Cleanup environment
        if: always()
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make destroy-infrastructure environment="$CLUSTER_ID"
