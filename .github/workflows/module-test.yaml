name: Execute module test

on:
  workflow_call:
    inputs:
      module:
        type: string
        default: "-"
      glob:
        type: string
        default: "-"
      preprovision:
        description: >-
          Apply the module's preprovision/ directory before testing, the way
          Workshop Studio does, and tell the lab those resources already exist.
          Needed by modules that cannot create their own prerequisites, such as
          Argo CD, which reads an IAM Identity Center user it refuses to create.
        type: boolean
        default: false
    outputs:
      durations-artifact:
        description: "The artifact ID of the test durations file"
        value: ${{ jobs.run-tests.outputs.durations-artifact }}

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    if: github.repository == 'aws-samples/eks-workshop-v2'
    name: run-tests
    runs-on: ubuntu-latest
    # Pre-provisioning creates an IAM Identity Center instance, and an account has
    # exactly one per Region, so two of those runs cannot overlap. They share a
    # single group and queue behind each other. Everything else stays keyed by
    # module, so unrelated suites still run in parallel as they do today.
    concurrency:
      group: ${{ inputs.preprovision == true && 'module-test-preprovision' || format('module-test-{0}-{1}', inputs.module, inputs.glob) }}
      cancel-in-progress: false
    outputs:
      durations-artifact: ${{ steps.upload-durations.outputs.artifact-id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Install utilities
        run: |
          sudo apt install -y gettext

          mkdir -p ${HOME}/.local/bin
          wget -q https://github.com/jckuester/awsweeper/releases/download/v0.12.0/awsweeper_0.12.0_linux_amd64.tar.gz
          tar zxf awsweeper_0.12.0_linux_amd64.tar.gz
          mv awsweeper_0.12.0_linux_amd64/awsweeper ${HOME}/.local/bin

          chmod +x ${HOME}/.local/bin/*

          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Set cluster ID
        env:
          RUN_ID: "${{ github.job }}"
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          CLUSTER_ID=$(echo $RANDOM | md5sum | head -c 8)
          echo "Using cluster ID ${CLUSTER_ID}"
          echo "CLUSTER_ID=$CLUSTER_ID" >> $GITHUB_ENV
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Create infrastructure
        id: create-infrastructure
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make create-infrastructure environment="$CLUSTER_ID"
      - name: Pre-provision lab resources
        # Runs after the clusters exist, because pre-provisioning targets them.
        if: inputs.preprovision == true
        env:
          MODULE: ${{ inputs.module }}
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=apply module="$MODULE"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Module
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          GENERATE_TIMINGS: 1
          TEST_REPORT: /tmp/test-output.json
          MODULE: ${{ inputs.module }}
          GLOB: ${{ inputs.glob }}
          AWS_REGION: "${{ secrets.AWS_REGION }}"
          DOCKER_DNS_OVERRIDE: "8.8.8.8"
          # Tells the lab that preprovision/ already created what it needs, so it
          # reads those resources instead of creating them a second time.
          RESOURCES_PRECREATED: ${{ inputs.preprovision }}
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          bash hack/run-tests.sh "$CLUSTER_ID" "$MODULE" "$GLOB"
      - uses: actions/upload-artifact@v4
        id: upload-durations
        with:
          name: test-durations-${{ env.CLUSTER_ID }}
          path: website/test-durations.json
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Cleanup
        if: always()
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          AWS_REGION: "${{ secrets.AWS_REGION }}"
          RESOURCES_PRECREATED: ${{ inputs.preprovision }}
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make test environment="$CLUSTER_ID" module="cleanup"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Destroy pre-provisioned lab resources
        # Before the clusters go, because the Argo CD capability is attached to one
        # and is created with delete_propagation_policy = RETAIN. This also releases
        # the account's single IAM Identity Center instance for the next run.
        if: always() && inputs.preprovision == true
        env:
          MODULE: ${{ inputs.module }}
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=destroy module="$MODULE"
      - name: Cleanup environment
        if: always()
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make destroy-infrastructure environment="$CLUSTER_ID"
