name: Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

# Title, label and description checks live in pr-metadata.yaml, which also runs
# on edited/labeled/unlabeled. Keeping those events out of this workflow means
# a label or milestone edit no longer re-runs the builds.

permissions:
  contents: read

# Only the latest run per PR matters: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-website:
    name: "Build website"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get kubectl version
        run: |
          source hack/lib/kubectl-version.sh
          echo "Using kubectl ${KUBECTL_VERSION}"
          echo "KUBECTL_VERSION=$KUBECTL_VERSION" >> $GITHUB_ENV
      - uses: azure/setup-kubectl@v4
        with:
          version: "${{ env.KUBECTL_VERSION }}"
        id: install
      - name: Run website build
        run: |
          export LAB_TIMES_ENABLED='true'
          yarn install
          # Build only the default (en) locale on PRs. Translations for newly
          # added modules are produced post-merge by the auto-translate workflow
          # (push to main), so a full multi-locale build here fails the broken
          # links check on untranslated pages. The full build runs on publish.
          yarn workspace website build --locale en

  build-lab:
    name: "Build lab"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Make shell
        env:
          SKIP_CREDENTIALS: 1
        run: |
          bash hack/exec.sh '' 'ls -la'

  terraform-validate:
    name: "Validate Terraform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9.0"
      - name: Check Terraform formatting
        run: |
          # An explicit file list, not `terraform fmt -recursive`: the recursive
          # walk skips dot-directories, and most of the lab Terraform lives
          # under .workshop/.
          git ls-files -z '*.tf' '*.tfvars' | xargs -0 terraform fmt -check -diff
      - name: Validate Terraform
        run: |
          bash hack/validate-terraform.sh
