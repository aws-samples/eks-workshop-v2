name: Test - Automation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 5"
permissions:
  id-token: write
  contents: read
jobs:
  test-module:
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a plain list of modules so the Argo CD suite can
        # ask for the IAM Identity Center test identity. The lab reads an Identity
        # Center user that it deliberately refuses to create, so without this the
        # module has no identity to sign in with and cannot be tested at all. It
        # still creates its own Argo CD capability, as it does outside an event.
        include:
          - module: automation/gitops
            idc: true
          - module: automation/controlplanes
            idc: false
    uses: ./.github/workflows/module-test.yaml
    with:
      module: ${{ matrix.module }}
      idc: ${{ matrix.idc }}
    secrets: inherit
