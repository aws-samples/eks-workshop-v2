name: Test - Fastpaths

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 5"

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    if: github.repository == 'aws-samples/eks-workshop-v2'
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install utilities
        run: |
          sudo apt install -y gettext

          mkdir -p ${HOME}/.local/bin
          wget -q https://github.com/jckuester/awsweeper/releases/download/v0.12.0/awsweeper_0.12.0_linux_amd64.tar.gz
          tar zxf awsweeper_0.12.0_linux_amd64.tar.gz
          mv awsweeper_0.12.0_linux_amd64/awsweeper ${HOME}/.local/bin

          chmod +x ${HOME}/.local/bin/*

          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Install Terraform
        # Creating the Identity Center test identity runs terraform on the runner
        # itself, not inside the lab container, and ubuntu-latest does not ship it.
        # Same version as module-test.yaml and the lab IDE (terraform_version in
        # lab/scripts/installer.sh). Installed before the clusters are created so the
        # always() destroy step still has it.
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false
      - name: Set cluster ID
        env:
          RUN_ID: "${{ github.job }}"
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          CLUSTER_ID=$(echo $RANDOM | md5sum | head -c 8)
          echo "Using cluster ID ${CLUSTER_ID}"
          echo "CLUSTER_ID=$CLUSTER_ID" >> $GITHUB_ENV
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Create infrastructure
        id: create-infrastructure
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make create-infrastructure environment="$CLUSTER_ID"
      - name: Create IAM Identity Center test identity
        # Only the identity the eks-capabilities path signs in with: the Identity Center
        # user, the <cluster>-argocd-admins group and its membership, and the secret
        # holding the activated password (manifests/.workshop/terraform/preprovision-base).
        # A lab never creates these itself. Everything else, the capabilities included,
        # the fast paths create through a normal prepare-environment, as they do locally.
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=apply module="idc-base"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Fastpaths
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          AWS_REGION: "${{ secrets.AWS_REGION }}"
          DOCKER_DNS_OVERRIDE: "8.8.8.8"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          bash hack/run-tests.sh "$CLUSTER_ID" "-" "{fastpaths/getting-started,fastpaths/getting-started/**,fastpaths/operator,fastpaths/operator/**,fastpaths/developer,fastpaths/developer/**,fastpaths/eks-capabilities,fastpaths/eks-capabilities/**}"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Run tests - Cleanup
        if: always()
        env:
          DOCKER_BUILDKIT: 1
          DEV_MODE: 1
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make test environment="$CLUSTER_ID" module="cleanup"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Destroy IAM Identity Center test identity
        # After the lab cleanup, so no capability still maps the group. The Identity
        # Center instance itself is permanent in the test account and is not deleted:
        # preprovision-base only removes an instance it created.
        if: always()
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          export AWS_DEFAULT_REGION="$AWS_REGION"
          make pre-provision environment="$CLUSTER_ID" action=destroy module="idc-base"
      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GithubActionsSession-${{ env.CLUSTER_ID }}
      - name: Cleanup environment
        if: always()
        env:
          AWS_REGION: "${{ secrets.AWS_REGION }}"
        run: |
          make destroy-infrastructure environment="$CLUSTER_ID"
