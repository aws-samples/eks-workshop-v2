name: Pull Request Metadata

# Fast checks on the PR itself (title, labels, touched paths). They run on
# edits and label changes too, so they live apart from pr.yaml: changing a
# label re-runs only this one-runner job, not the builds.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: "PR metadata"
    runs-on: ubuntu-latest
    steps:
      # Each check continues on error so all of them run; the last step fails
      # the job and names every check that failed.
      - name: Semantic Pull Request
        id: semantic
        continue-on-error: true
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            new
            update
            fix
            chore
            feat
            docs

      - name: Check for content label
        id: content-label
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels;
            const hasContentLabel = labels.some(label => label.name.startsWith('content/'));

            if (!hasContentLabel) {
              core.setFailed('This pull request must have a label that starts with "content/"');
            } else {
              console.log('Pull request has a valid content label');
            }

      - name: Block manual i18n changes
        id: i18n
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const i18nFiles = files.filter(f => f.filename.startsWith('website/i18n/'));

            if (i18nFiles.length > 0) {
              const headRef = context.payload.pull_request.head.ref;

              // Allow the automated translation branch
              if (headRef === 'automated-translations') {
                console.log('Automated translation branch detected — allowing i18n changes.');
                return;
              }

              const fileList = i18nFiles.map(f => `  - ${f.filename}`).join('\n');
              core.setFailed(
                `This PR modifies files under website/i18n/ which are auto-generated by the translation pipeline.\n\n` +
                `Modified i18n files:\n${fileList}\n\n` +
                `Please remove these changes. If you found a translation issue, open an issue instead.`
              );
            }

      - name: Report results
        if: always()
        env:
          SEMANTIC: ${{ steps.semantic.outcome }}
          CONTENT_LABEL: ${{ steps.content-label.outcome }}
          I18N: ${{ steps.i18n.outcome }}
        run: |
          failed=0
          {
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          report() {
            echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" != "success" ]; then
              echo "::error title=PR metadata::$1: $2"
              failed=1
            fi
          }
          report "Semantic Pull Request" "$SEMANTIC"
          report "Check for content label" "$CONTENT_LABEL"
          report "Block manual i18n changes" "$I18N"
          exit "$failed"
