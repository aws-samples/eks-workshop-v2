<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495B6B"/>
    </marker>
    <marker id="arrowCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4FFF"/>
    </marker>
    <marker id="arrowHop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D13212"/>
    </marker>
  </defs>

  <rect width="1680" height="900" fill="#FFFFFF"/>
  <text x="840" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#232F3E">Exposing the ui Service with a Network Load Balancer (instance mode)</text>

  <!-- Internet users -->
  <rect x="40" y="396" width="160" height="124" rx="10" fill="#F4F6F8" stroke="#5A6B7B" stroke-width="2"/>
  <circle cx="120" cy="440" r="17" fill="none" stroke="#232F3E" stroke-width="2"/>
  <path d="M 103 440 h 34 M 120 423 c 9 8 9 26 0 34 M 120 423 c -9 8 -9 26 0 34" fill="none" stroke="#232F3E" stroke-width="1.6"/>
  <text x="120" y="484" text-anchor="middle" font-size="17" font-weight="700" fill="#232F3E">Internet</text>
  <text x="120" y="505" text-anchor="middle" font-size="15" fill="#4A5B6B">users</text>

  <!-- AWS Cloud -->
  <rect x="236" y="100" width="1408" height="756" rx="12" fill="none" stroke="#232F3E" stroke-width="2.5"/>
  <rect x="254" y="114" width="30" height="30" rx="5" fill="#232F3E"/>
  <path d="M 261 132 h 16 M 261 126 c 3 -5 13 -5 16 0" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="294" y="136" font-size="19" font-weight="700" fill="#232F3E">AWS Cloud</text>

  <!-- VPC -->
  <rect x="260" y="152" width="1360" height="682" rx="10" fill="#F8F5FF" stroke="#8C4FFF" stroke-width="2.5"/>
  <rect x="278" y="166" width="30" height="30" rx="5" fill="#8C4FFF"/>
  <path d="M 285 188 h 16 M 285 181 c 3 -5 13 -5 16 0" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="318" y="188" font-size="19" font-weight="700" fill="#8C4FFF">Amazon VPC</text>

  <!-- NLB -->
  <rect x="300" y="330" width="216" height="216" rx="10" fill="#F3EBFF" stroke="#8C4FFF" stroke-width="2.5"/>
  <rect x="384" y="348" width="48" height="48" rx="7" fill="#8C4FFF"/>
  <path d="M 398 365 h 20 M 398 372 h 20 M 398 379 h 20" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="408" y="421" text-anchor="middle" font-size="18" font-weight="700" fill="#6B2FD9">Network Load</text>
  <text x="408" y="442" text-anchor="middle" font-size="18" font-weight="700" fill="#6B2FD9">Balancer</text>
  <text x="408" y="463" text-anchor="middle" font-size="14" fill="#4A5B6B">internet-facing</text>
  <line x1="318" y1="478" x2="498" y2="478" stroke="#C9AEF7" stroke-width="1.5"/>
  <text x="408" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Listener TCP :80</text>
  <text x="408" y="522" text-anchor="middle" font-size="13" fill="#4A5B6B">Target group: 3 EC2</text>
  <text x="408" y="539" text-anchor="middle" font-size="13" fill="#4A5B6B">instances on TCP :30549</text>

  <!-- user -> NLB -->
  <line x1="200" y1="452" x2="294" y2="440" stroke="#495B6B" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="208" y="414" font-size="14" fill="#4A5B6B">TCP :80</text>

  <!-- AWS Load Balancer Controller -->
  <rect x="300" y="600" width="216" height="164" rx="10" fill="#EFF6FF" stroke="#0972D3" stroke-width="2.2"/>
  <text x="408" y="630" text-anchor="middle" font-size="16" font-weight="700" fill="#0356A8">AWS Load Balancer</text>
  <text x="408" y="651" text-anchor="middle" font-size="16" font-weight="700" fill="#0356A8">Controller</text>
  <line x1="318" y1="665" x2="498" y2="665" stroke="#B9D6F2" stroke-width="1.5"/>
  <text x="408" y="688" text-anchor="middle" font-size="13" fill="#4A5B6B">watches Service/ui-nlb</text>
  <text x="408" y="710" text-anchor="middle" font-size="13" fill="#4A5B6B">creates the NLB, listener</text>
  <text x="408" y="727" text-anchor="middle" font-size="13" fill="#4A5B6B">and target group, then</text>
  <text x="408" y="744" text-anchor="middle" font-size="13" fill="#4A5B6B">registers the nodes</text>
  <line x1="408" y1="596" x2="408" y2="552" stroke="#8C4FFF" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrowCtl)"/>

  <!-- EKS cluster -->
  <rect x="576" y="200" width="1030" height="600" rx="10" fill="#FEF4F8" stroke="#E7157B" stroke-width="2.5"/>
  <rect x="596" y="214" width="30" height="30" rx="5" fill="#E7157B"/>
  <path d="M 611 220 l 9 5 v 9 l -9 5 l -9 -5 v -9 z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="636" y="236" font-size="19" font-weight="700" fill="#E7157B">Amazon EKS cluster</text>

  <!-- Worker node 1 -->
  <rect x="602" y="252" width="596" height="150" rx="9" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
  <text x="622" y="278" font-size="16" font-weight="700" fill="#232F3E">Worker node 1 (EC2)</text>
  <rect x="622" y="292" width="162" height="94" rx="7" fill="#EEF2F6" stroke="#8494A5" stroke-width="1.8"/>
  <text x="703" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">kube-proxy</text>
  <text x="703" y="345" text-anchor="middle" font-size="14" fill="#4A5B6B">NodePort</text>
  <text x="703" y="365" text-anchor="middle" font-size="14" fill="#4A5B6B">:30549</text>
  <rect x="912" y="292" width="256" height="94" rx="7" fill="#FCE8F1" stroke="#E7157B" stroke-width="2"/>
  <text x="1040" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#B01262">ui Pod</text>
  <text x="1040" y="352" text-anchor="middle" font-size="14" fill="#4A5B6B">10.42.140.129:8080</text>
  <line x1="788" y1="339" x2="906" y2="339" stroke="#495B6B" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Worker node 2 -->
  <rect x="602" y="424" width="596" height="150" rx="9" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
  <text x="622" y="450" font-size="16" font-weight="700" fill="#232F3E">Worker node 2 (EC2)</text>
  <rect x="622" y="464" width="162" height="94" rx="7" fill="#EEF2F6" stroke="#8494A5" stroke-width="1.8"/>
  <text x="703" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">kube-proxy</text>
  <text x="703" y="517" text-anchor="middle" font-size="14" fill="#4A5B6B">NodePort</text>
  <text x="703" y="537" text-anchor="middle" font-size="14" fill="#4A5B6B">:30549</text>
  <rect x="912" y="464" width="256" height="94" rx="7" fill="#FFFFFF" stroke="#B6C2CE" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1040" y="504" text-anchor="middle" font-size="15" fill="#8494A5">no ui Pod</text>
  <text x="1040" y="527" text-anchor="middle" font-size="14" fill="#8494A5">on this node</text>

  <!-- Worker node 3 -->
  <rect x="602" y="612" width="596" height="150" rx="9" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
  <text x="622" y="638" font-size="16" font-weight="700" fill="#232F3E">Worker node 3 (EC2)</text>
  <rect x="622" y="652" width="162" height="94" rx="7" fill="#EEF2F6" stroke="#8494A5" stroke-width="1.8"/>
  <text x="703" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">kube-proxy</text>
  <text x="703" y="705" text-anchor="middle" font-size="14" fill="#4A5B6B">NodePort</text>
  <text x="703" y="725" text-anchor="middle" font-size="14" fill="#4A5B6B">:30549</text>
  <rect x="912" y="652" width="256" height="94" rx="7" fill="#FCE8F1" stroke="#E7157B" stroke-width="2"/>
  <text x="1040" y="686" text-anchor="middle" font-size="16" font-weight="700" fill="#B01262">ui Pod</text>
  <text x="1040" y="712" text-anchor="middle" font-size="14" fill="#4A5B6B">10.42.105.38:8080</text>
  <line x1="788" y1="699" x2="906" y2="699" stroke="#495B6B" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- NLB -> registered instances -->
  <path d="M 520 380 C 556 356 566 336 598 326" fill="none" stroke="#495B6B" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 520 438 C 556 456 566 486 598 498" fill="none" stroke="#495B6B" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 520 496 C 552 580 558 664 598 699" fill="none" stroke="#495B6B" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- extra hop: node 2 has no ui Pod, kube-proxy relays to node 3 -->
  <path d="M 703 562 V 598 H 1040 V 648" fill="none" stroke="#D13212" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowHop)"/>
  <text x="768" y="590" font-size="13" font-weight="700" fill="#D13212">extra network hop via kube-proxy</text>

  <!-- Service card -->
  <rect x="1236" y="252" width="350" height="238" rx="9" fill="#EFF6FF" stroke="#0972D3" stroke-width="2.2"/>
  <text x="1411" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#0356A8">Service/ui-nlb</text>
  <line x1="1256" y1="296" x2="1566" y2="296" stroke="#B9D6F2" stroke-width="1.5"/>
  <text x="1256" y="323" font-size="14" fill="#232F3E">type: LoadBalancer</text>
  <text x="1256" y="349" font-size="14" fill="#232F3E">port 80 → targetPort 8080</text>
  <text x="1256" y="383" font-size="13" font-weight="700" fill="#4A5B6B">annotations</text>
  <text x="1256" y="408" font-size="13" fill="#232F3E">aws-load-balancer-type: external</text>
  <text x="1256" y="432" font-size="13" fill="#232F3E">scheme: internet-facing</text>
  <text x="1256" y="456" font-size="13" fill="#232F3E">nlb-target-type: instance</text>
  <text x="1256" y="480" font-size="13" fill="#232F3E">load-balancer-source-ranges</text>

  <!-- footnote -->
  <text x="840" y="884" text-anchor="middle" font-size="15" fill="#4A5B6B">In instance mode the NLB forwards to a NodePort on every registered node, and kube-proxy relays the connection to a ui Pod — sometimes on a different node.</text>
</svg>
